# Settings for generate, build, and publish.
# The version directory supplies the image name and tag.

# Required for generate and build
CONTAINER_PREFIX='tgenv'

# Required for publish.
DOCKER_HUB_ORG='lupaxa'
GHCR_ORGNAME='lupaxa-docker-toolbox'

# Single-OS trees: Dockerfiles/<version>/ and the image name below.
# Families to build are listed in Config/os.cfg.
SINGLE_OS=false
SINGLE_OS_NAME=''
NO_OS_NAME_IN_CONTAINER=false

# Finished image starts bash. Version Helper still uses the base image shell.
IMAGE_SHELL='bash'
